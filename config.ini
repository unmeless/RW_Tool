[ocr]
# 目标识别频率（Hz）；实际受单次 OCR 耗时限制，完成后按间隔再调度下一轮
frequency_hz = 20.0
# 识别前放大倍数（越大越准越慢，常用 1.5–2.5）
preprocess_scale = 2.5
# 预处理：game_ui | none（仅 dual_preprocess=true 时 game_ui 会多跑一遍增强图）
preprocess_mode = game_ui
# 是否对 game_ui 做第二遍增强图识别（false 约快一倍；难例可改 true）
dual_preprocess = false
# 送入 OCR 前最长边上限像素（0=不限制；识别区很大时建议 960–1280）
ocr_max_side = 1280
# 版面：strip=按 1~2 行切条后仅识别（跳过文字检测，适合固定描述框）；auto=完整检测+识别
ocr_layout = strip
ocr_strip_max_lines = 2
# 横排游戏 UI 可关闭方向分类以提速（strip 模式推荐 false）
use_angle_cls = false
# 拖拽/缩放结束后，延迟多久再恢复定时识别（毫秒）
resume_delay_ms = 400
# 调试总开关：开启后显示 Settings 面板并常驻坐标等信息
debug = false
debug_save_capture = false
# 与 debug / debug_save_capture 任一为 true 时显示 Settings 调试面板
debug_show_coords = false
debug_capture_path = debug_last_capture.png

[settings]
# debug 开启时，识别区下方 Settings 面板高度（像素）
panel_height = 88
# 各区域字号（像素）；font_match / font_ocr_result 仅 icon_panel.enabled=false 时使用
font_match = 26
font_ocr_result = 13
font_drag_grip = 8
font_settings_title = 11
font_settings_debug = 10
font_settings_checkbox = 11

[window]
# 关闭时保存窗口位置/大小到 window_state.json，下次启动恢复
restore_saved_geometry = true
# 边缘缩放热区宽度（像素，仅左/右/底边中段）
resize_border_px = 10
# 四角缩放热区边长（像素，优先于移动）
corner_handle_px = 30
# 顶栏高度（其左右角为缩放，中间握把为移动）
drag_bar_height = 26
# 顶栏中央「移动」握把宽度（仅此处可拖动整窗）
move_grip_width = 100
# 结果区左侧「移动」握把宽度（仅 icon_panel.enabled=false）
result_move_grip_width = 36
min_capture_width = 120
min_capture_height = 80
# 以下仅 icon_panel.enabled=false 时生效
result_panel_height = 100
match_panel_height = 84

[engine]
backend = rapidocr
det_box_thresh = 0.2
text_score = 0.3

[matcher]
# 将 OCR 文本模糊匹配到 desc.json 中的小动物名称
enabled = true
catalog_path = desc.json
# 小动物图标目录（文件名为「名称.png」）
icon_dir = img
# 自动认定匹配的最低分（0–100）
min_score = 58
# 第一名需领先第二名至少该分差，否则标为「不确定」（match_top_k=1 时无效）
min_margin = 8
# 低于该分数的候选不入列，视为未匹配（0–100）
min_candidate_score = 50
# 结果区是否显示 OCR 原文（仅 icon_panel.enabled=false）
show_ocr_raw = true
# 匹配列表最多显示条数
match_top_k = 1

[icon_panel]
# 独立可拖动的图标条（主界面仅保留扫描框时显示此项）
enabled = true
icon_size = 56
# 宽度由 match_top_k × cell_width 自动计算，无需 panel_width
cell_width = 84
cell_spacing = 8
panel_padding = 16
panel_height = 110
min_height = 90
bg_opacity = 0
# 是否在图标下方显示匹配概率（%）
show_score = false
font_score = 16
